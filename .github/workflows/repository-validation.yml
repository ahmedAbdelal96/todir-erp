name: TODIR validation

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todir_p03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todir_p03"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: todir
          RABBITMQ_DEFAULT_PASS: todir-dev-only
          RABBITMQ_DEFAULT_VHOST: /erp-dev
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.102

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Verify pinned pnpm
        run: pnpm --version

      - name: Restore .NET solution
        run: dotnet restore Todir.sln

      - name: Build .NET solution
        run: dotnet build Todir.sln --no-restore

      - name: Verify .NET formatting
        run: dotnet format Todir.sln --verify-no-changes --no-restore

      - name: Apply controlled database bootstrap
        run: dotnet run --project src/backend/hosts/database-migrator/database-migrator.csproj --no-build
        env:
          TODIR_MIGRATOR_CONNECTION: Host=localhost;Port=5432;Database=todir_p03;Username=postgres;Password=postgres
          TODIR_REPOSITORY_ROOT: ${{ github.workspace }}

      - name: Run .NET tests
        run: dotnet test Todir.sln --no-build
        env:
          TODIR_P03_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=todir_p03;Username=postgres;Password=postgres
          TODIR_P04_ADMIN_CONNECTION: Host=localhost;Port=5432;Database=todir_p03;Username=postgres;Password=postgres
          TODIR_RABBITMQ_HOST: localhost
          TODIR_RABBITMQ_PORT: 5672
          TODIR_RABBITMQ_VHOST: /erp-dev
          TODIR_RABBITMQ_USERNAME: todir
          TODIR_RABBITMQ_PASSWORD: todir-dev-only

      - name: Restore frontend tooling
        run: pnpm install --frozen-lockfile

      - name: Type-check TypeScript baseline
        run: pnpm typecheck

      - name: Validate frontend module boundaries
        run: pnpm architecture:frontend

      - name: Validate module manifests and dependency graph
        run: pnpm architecture:modules

      - name: Validate database policy declarations
        run: pnpm database:policy

      - name: Validate migration expand-contract policy
        run: pnpm database:migration-policy

      - name: Validate API contract
        run: pnpm api:contract

      - name: Regenerate API client and verify clean tree
        run: |
          pnpm api:generate
          git diff --exit-code -- src/frontend/apps/todir-web/src/api/platform-client.ts

      - name: Validate generated API client
        run: pnpm api:drift

      - name: Audit .NET dependencies
        run: dotnet list Todir.sln package --vulnerable --include-transitive

      - name: Check API breaking changes
        run: pnpm api:breaking

      - name: Validate frontend shell
        run: pnpm frontend:smoke

      - name: Validate repository release gates
        run: pnpm release:gates

      - name: Audit production frontend dependencies
        run: pnpm audit --prod

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Validate OpenTofu formatting
        run: tofu fmt -check -recursive ops/terraform

      - name: Build immutable application images
        run: |
          docker build --tag "kernel-api:${GITHUB_SHA}" --file ops/containers/api.Dockerfile .
          docker build --tag "kernel-worker:${GITHUB_SHA}" --file ops/containers/worker.Dockerfile .
          docker build --tag "kernel-migrator:${GITHUB_SHA}" --file ops/containers/database-migrator.Dockerfile .
          docker build --tag "kernel-web:${GITHUB_SHA}" --file ops/containers/web.Dockerfile .

      - name: Scan application images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "kernel-api:${{ github.sha }}"
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "kernel-worker:${{ github.sha }}"
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan migrator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "kernel-migrator:${{ github.sha }}"
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "kernel-web:${{ github.sha }}"
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Validate staging infrastructure
        working-directory: ops/terraform
        run: |
          tofu init -backend=false
          tofu validate

      - name: Prepare isolated staging secrets
        shell: bash
        run: |
          database_password="$(openssl rand -hex 24)"
          rabbit_password="$(openssl rand -hex 24)"
          entitlement_hmac_key="$(openssl rand -hex 32)"
          replay_token="$(openssl rand -hex 32)"
          certificate_password="$(openssl rand -hex 24)"
          certificate_file="$RUNNER_TEMP/data-protection.pfx"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=kernel-data-protection" \
            -keyout "$RUNNER_TEMP/data-protection.key" \
            -out "$RUNNER_TEMP/data-protection.crt" >/dev/null 2>&1
          openssl pkcs12 -export -out "$certificate_file" \
            -inkey "$RUNNER_TEMP/data-protection.key" \
            -in "$RUNNER_TEMP/data-protection.crt" \
            -passout "pass:$certificate_password" >/dev/null 2>&1
          certificate_base64="$(base64 -w 0 "$certificate_file")"
          rabbit_tls_directory="$RUNNER_TEMP/rabbit-tls"
          mkdir -p "$rabbit_tls_directory"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=rabbitmq" \
            -addext "subjectAltName=DNS:rabbitmq" \
            -keyout "$rabbit_tls_directory/server.key" \
            -out "$rabbit_tls_directory/ca.crt" >/dev/null 2>&1
          cp "$rabbit_tls_directory/ca.crt" "$rabbit_tls_directory/server.crt"
          sudo chown 999:999 "$rabbit_tls_directory/ca.crt" "$rabbit_tls_directory/server.crt" "$rabbit_tls_directory/server.key"
          chmod 444 "$rabbit_tls_directory/ca.crt" "$rabbit_tls_directory/server.crt"
          chmod 400 "$rabbit_tls_directory/server.key"
          web_tls_directory="$RUNNER_TEMP/web-tls"
          mkdir -p "$web_tls_directory"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$web_tls_directory/server.key" \
            -out "$web_tls_directory/server.crt" >/dev/null 2>&1
          chmod 644 "$web_tls_directory/server.crt"
          chmod 600 "$web_tls_directory/server.key"
          echo "::add-mask::$database_password"
          echo "::add-mask::$rabbit_password"
          echo "::add-mask::$entitlement_hmac_key"
          echo "::add-mask::$replay_token"
          echo "::add-mask::$certificate_password"
          echo "::add-mask::$certificate_base64"
          echo "STAGING_DATABASE_PASSWORD=$database_password" >> "$GITHUB_ENV"
          echo "STAGING_RABBIT_PASSWORD=$rabbit_password" >> "$GITHUB_ENV"
          echo "STAGING_ENTITLEMENT_HMAC_KEY=$entitlement_hmac_key" >> "$GITHUB_ENV"
          echo "STAGING_REPLAY_TOKEN=$replay_token" >> "$GITHUB_ENV"
          echo "STAGING_CERTIFICATE_PASSWORD=$certificate_password" >> "$GITHUB_ENV"
          echo "STAGING_CERTIFICATE_BASE64=$certificate_base64" >> "$GITHUB_ENV"
          echo "STAGING_RABBIT_TLS_DIRECTORY=$rabbit_tls_directory" >> "$GITHUB_ENV"
          echo "STAGING_WEB_TLS_DIRECTORY=$web_tls_directory" >> "$GITHUB_ENV"

      - name: Create staging from OpenTofu
        working-directory: ops/terraform
        run: >-
          tofu apply -auto-approve
          -var="image_tag=${{ github.sha }}"
          -var="api_image=kernel-api:${{ github.sha }}"
          -var="worker_image=kernel-worker:${{ github.sha }}"
          -var="migrator_image=kernel-migrator:${{ github.sha }}"
          -var="web_image=kernel-web:${{ github.sha }}"
          -var="database_password=${{ env.STAGING_DATABASE_PASSWORD }}"
          -var="rabbit_password=${{ env.STAGING_RABBIT_PASSWORD }}"
          -var="entitlement_hmac_key=${{ env.STAGING_ENTITLEMENT_HMAC_KEY }}"
          -var="staging_replay_token=${{ env.STAGING_REPLAY_TOKEN }}"
          -var="data_protection_certificate_base64=${{ env.STAGING_CERTIFICATE_BASE64 }}"
          -var="data_protection_certificate_password=${{ env.STAGING_CERTIFICATE_PASSWORD }}"
          -var="rabbit_tls_directory=${{ env.STAGING_RABBIT_TLS_DIRECTORY }}"
          -var="web_tls_directory=${{ env.STAGING_WEB_TLS_DIRECTORY }}"
          -var="failure_injection=crash-after-inbox-commit,poison-message"

      - name: Run staging health smoke test
        run: |
          curl --fail --insecure --retry 30 --retry-delay 2 --retry-connrefused https://127.0.0.1:18081/health
          curl --fail --insecure --retry 30 --retry-delay 2 --retry-connrefused https://127.0.0.1:18081/health/ready
          curl --fail --insecure --retry 30 --retry-delay 2 --retry-connrefused https://127.0.0.1:18081/
          web_api_status="$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' https://127.0.0.1:18081/api/v1/session)"
          test "$web_api_status" = "401"

      - name: Run staging load and broker recovery drills
        env:
          STAGING_API_URL: https://127.0.0.1:18081
          STAGING_RABBIT_CONTAINER: kernel-${{ github.sha }}-rabbitmq
          STAGING_POSTGRES_CONTAINER: kernel-${{ github.sha }}-postgres
          STAGING_WORKER_CONTAINER: kernel-${{ github.sha }}-worker
          STAGING_WORKER_SECONDARY_CONTAINER: kernel-${{ github.sha }}-worker-secondary
          STAGING_MINIO_INIT_CONTAINER: kernel-${{ github.sha }}-minio-init
          STAGING_DATABASE_NAME: todir_staging
          STAGING_EXPECT_WORKER_CRASH: true
          STAGING_REPLAY_TOKEN: ${{ env.STAGING_REPLAY_TOKEN }}
          NODE_EXTRA_CA_CERTS: ${{ env.STAGING_WEB_TLS_DIRECTORY }}/server.crt
        run: node scripts/verification/staging-drills.mjs

      - name: Run staging backup and restore verification
        env:
          STAGING_POSTGRES_CONTAINER: kernel-${{ github.sha }}-postgres
          STAGING_NETWORK: kernel-${{ github.sha }}-private
          STAGING_MIGRATOR_IMAGE: kernel-migrator:${{ github.sha }}
          STAGING_DATABASE_PASSWORD: ${{ env.STAGING_DATABASE_PASSWORD }}
        shell: bash
        run: |
          backup_file="$RUNNER_TEMP/platform-backup.dump"
          original_schema="$RUNNER_TEMP/platform-schema.sql"
          restored_schema="$RUNNER_TEMP/platform-restored-schema.sql"
          restore_database="todir_staging_restore_verify"
          backup_started="$(date +%s)"
          docker exec "$STAGING_POSTGRES_CONTAINER" pg_dump --username=postgres --format=custom --file=/tmp/platform-backup.dump todir_staging
          docker cp "$STAGING_POSTGRES_CONTAINER:/tmp/platform-backup.dump" "$backup_file"
          docker exec "$STAGING_POSTGRES_CONTAINER" pg_dump --username=postgres --schema-only --no-owner todir_staging > "$original_schema"
          backup_finished="$(date +%s)"
          backup_checksum="$(sha256sum "$backup_file" | cut -d ' ' -f 1)"
          docker exec "$STAGING_POSTGRES_CONTAINER" dropdb --if-exists --username=postgres "$restore_database"
          docker exec "$STAGING_POSTGRES_CONTAINER" createdb --username=postgres "$restore_database"
          restore_started="$(date +%s)"
          docker exec "$STAGING_POSTGRES_CONTAINER" pg_restore --username=postgres --exit-on-error --dbname="$restore_database" /tmp/platform-backup.dump
          docker exec "$STAGING_POSTGRES_CONTAINER" pg_dump --username=postgres --schema-only --no-owner "$restore_database" > "$restored_schema"
          cmp --silent "$original_schema" "$restored_schema"
          restore_finished="$(date +%s)"
          docker run --rm --network "$STAGING_NETWORK" \
            -e "TODIR_MIGRATOR_CONNECTION=Host=$STAGING_POSTGRES_CONTAINER;Database=$restore_database;Username=postgres;Password=$STAGING_DATABASE_PASSWORD" \
            -e "TODIR_RUNTIME_PASSWORD=$STAGING_DATABASE_PASSWORD" \
            -e "TODIR_REPOSITORY_ROOT=/app" \
            "$STAGING_MIGRATOR_IMAGE"
          docker exec "$STAGING_POSTGRES_CONTAINER" psql --username=postgres --dbname="$restore_database" --command="select count(*) from platform_tenancy.tenant"
          rls_result="$(docker exec "$STAGING_POSTGRES_CONTAINER" psql --username=postgres --dbname="$restore_database" --tuples-only --no-align --command="select case when count(*) = 24 and bool_and(c.relrowsecurity and c.relforcerowsecurity) then 0 else 1 end from pg_class c join pg_namespace n on n.oid = c.relnamespace join (values ('platform_iam','membership_invitation'), ('platform_authz','role'), ('platform_authz','role_permission'), ('platform_authz','membership_role_assignment'), ('platform_modules','module_instance'), ('platform_modules','module_operation'), ('platform_entitlements','entitlement_snapshot'), ('platform_messaging','outbox_message'), ('platform_messaging','inbox_message'), ('platform_messaging','message_error'), ('platform_audit','audit_entry'), ('platform_numbering','sequence_definition'), ('platform_settings','setting_value'), ('platform_files','file_record'), ('platform_custom_fields','custom_field_definition'), ('platform_import','import_batch'), ('platform_import','import_error'), ('platform_import','import_chunk_job'), ('platform_notifications','notification'), ('platform_notifications','notification_delivery'), ('platform_scheduling','job_schedule'), ('platform_iam','support_access_grant'), ('sample','sample_item'), ('sample','sample_projection')) as expected(schema_name, table_name) on expected.schema_name = n.nspname and expected.table_name = c.relname where c.relkind = 'r'")"
          test "$rls_result" = "0"
          runtime_role_result="$(docker exec "$STAGING_POSTGRES_CONTAINER" psql --username=postgres --dbname="$restore_database" --tuples-only --no-align --command="select case when not rolsuper and not rolbypassrls then 0 else 1 end from pg_roles where rolname = 'erp_app'")"
          test "$runtime_role_result" = "0"
          echo "backup-artifact-sha256=$backup_checksum"
          echo "backup-duration-seconds=$((backup_finished - backup_started))"
          echo "restore-duration-seconds=$((restore_finished - restore_started))"
          echo "restore-schema-checksum=passed"
          echo "restore-rls-check=passed"
          echo "restore-runtime-role-check=passed"
          docker exec "$STAGING_POSTGRES_CONTAINER" dropdb --username=postgres "$restore_database"
          docker exec "$STAGING_POSTGRES_CONTAINER" rm --force /tmp/platform-backup.dump

      - name: Destroy isolated staging
        if: always()
        working-directory: ops/terraform
        run: >-
          tofu destroy -auto-approve
          -var="image_tag=${{ github.sha }}"
          -var="api_image=kernel-api:${{ github.sha }}"
          -var="worker_image=kernel-worker:${{ github.sha }}"
          -var="migrator_image=kernel-migrator:${{ github.sha }}"
          -var="web_image=kernel-web:${{ github.sha }}"
          -var="database_password=${{ env.STAGING_DATABASE_PASSWORD }}"
          -var="rabbit_password=${{ env.STAGING_RABBIT_PASSWORD }}"
          -var="entitlement_hmac_key=${{ env.STAGING_ENTITLEMENT_HMAC_KEY }}"
          -var="staging_replay_token=${{ env.STAGING_REPLAY_TOKEN }}"
          -var="data_protection_certificate_base64=${{ env.STAGING_CERTIFICATE_BASE64 }}"
          -var="data_protection_certificate_password=${{ env.STAGING_CERTIFICATE_PASSWORD }}"
          -var="rabbit_tls_directory=${{ env.STAGING_RABBIT_TLS_DIRECTORY }}"
          -var="web_tls_directory=${{ env.STAGING_WEB_TLS_DIRECTORY }}"
          -var="failure_injection=crash-after-inbox-commit,poison-message"

      - name: Validate Docker Compose skeleton
        run: docker compose config

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
