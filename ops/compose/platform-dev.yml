services:
  postgres:
    image: postgres:18
    # Development-only credentials are supplied by the local environment and are
    # intentionally absent from committed configuration.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TODIR_DEV_POSTGRES_ADMIN_PASSWORD:?Set TODIR_DEV_POSTGRES_ADMIN_PASSWORD before starting Compose}
      POSTGRES_DB: todir
    # Keep the container port canonical while avoiding a pre-existing local PostgreSQL listener.
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todir"]
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:4.1-management
    # Development-only credentials are supplied by the local environment. The
    # management and broker ports are loopback-only.
    environment:
      RABBITMQ_DEFAULT_USER: todir
      RABBITMQ_DEFAULT_PASS: ${TODIR_DEV_RABBITMQ_PASSWORD:?Set TODIR_DEV_RABBITMQ_PASSWORD before starting Compose}
      RABBITMQ_DEFAULT_VHOST: /erp-dev
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    # Memurai owns the local 6380 port; keep the Docker Redis listener loopback-only on 6381.
    ports: ["127.0.0.1:6381:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    # The upstream community image is no longer pullable from Docker Hub or Quay.
    # This public mirror preserves the exact release and is pinned by digest.
    # Development-only credentials are supplied by the local environment. The API
    # must use an independently provisioned non-root identity outside this
    # convenience stack.
    image: jumpserver/minio:RELEASE.2024-06-13T22-53-53Z@sha256:fea940414bd63fc721a8f5a1103d00b58312ecb9cdb89557b1164f32f23777f8
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: todir
      MINIO_ROOT_PASSWORD: ${TODIR_DEV_OBJECT_STORAGE_PASSWORD:?Set TODIR_DEV_OBJECT_STORAGE_PASSWORD before starting Compose}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
  clamav:
    image: clamav/clamav:1.5.4_base-debian13-slim
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 2"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m

volumes:
  redis-data:
