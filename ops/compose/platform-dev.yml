services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todir
    # Keep the container port canonical while avoiding a pre-existing local PostgreSQL listener.
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todir"]
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: todir
      RABBITMQ_DEFAULT_PASS: todir-dev-only
      RABBITMQ_DEFAULT_VHOST: /erp-dev
    ports: ["5672:5672", "15672:15672"]
  minio:
    # The upstream community image is no longer pullable from Docker Hub or Quay.
    # This public mirror preserves the exact release and is pinned by digest.
    image: jumpserver/minio:RELEASE.2024-06-13T22-53-53Z@sha256:fea940414bd63fc721a8f5a1103d00b58312ecb9cdb89557b1164f32f23777f8
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: todir
      MINIO_ROOT_PASSWORD: todir-dev-only
    ports: ["19000:9000", "19001:9001"]
  clamav:
    image: clamav/clamav:1.5.4_base-debian13-slim
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 2"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
