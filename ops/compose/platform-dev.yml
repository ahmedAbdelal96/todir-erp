services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todir
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todir"]
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: todir
      RABBITMQ_DEFAULT_PASS: todir-dev-only
      RABBITMQ_DEFAULT_VHOST: /erp-dev
    ports: ["5672:5672", "15672:15672"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: todir
      MINIO_ROOT_PASSWORD: todir-dev-only
    ports: ["9000:9000", "9001:9001"]
