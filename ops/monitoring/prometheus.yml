global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [host.docker.internal:5091]
        labels:
          service: api

  - job_name: worker
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [host.docker.internal:5081]
        labels:
          service: worker

  - job_name: data-protection
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [host.docker.internal:9105]
        labels:
          service: data-protection
