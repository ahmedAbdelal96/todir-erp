global:
  resolve_timeout: 1m

route:
  receiver: local-test-receiver
  group_by: [alertname, job, service]
  group_wait: 0s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: local-test-receiver
    webhook_configs:
      - url: http://host.docker.internal:19091/alerts
        send_resolved: true
