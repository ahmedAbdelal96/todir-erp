groups:
  - name: kernel-platform
    rules:
      - alert: OutboxBacklogAgeHigh
        expr: todir_outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Transactional outbox backlog is older than five minutes.
      - alert: WorkerUnavailable
        expr: up{service="background-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Background worker is unavailable.
      - alert: ApiErrorRateHigh
        expr: sum(rate(todir_http_requests_total{status_class="5xx"}[5m])) / sum(rate(todir_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API server error rate exceeded five percent.
